# RedVital — autenticación de PostgreSQL en la VM de datos.
# Socket local: solo el superusuario, para la inicialización y el mantenimiento
# desde dentro del contenedor (docker exec).
local   all   postgres                peer
local   all   all                     reject
# Red: únicamente TLS con SCRAM-SHA-256. Sin TLS, la conexión se rechaza.
# Quién llega a la VM lo decide el firewall (solo la VM de servicios).
hostssl all   all       0.0.0.0/0     scram-sha-256
hostssl all   all       ::/0          scram-sha-256
host    all   all       0.0.0.0/0     reject
host    all   all       ::/0          reject
